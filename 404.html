<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — pages-lab</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #ffffff;
    --fg: #111111;
    --muted: #555555;
    --accent: #0a58ca;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --fg: #e6edf3;
      --muted: #9aa4af;
      --accent: #6ea8fe;
    }
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 1.5rem;
    text-align: center;
  }
  a { color: var(--accent); }
  p { color: var(--muted); margin-top: 0.5rem; }
  .title { font-size: 1.25rem; font-weight: 600; color: var(--fg); }
</style>
</head>
<body>
  <div id="fallback">
    <p>Redirecting…</p>
  </div>
  <script>
    // GitHub Pages has no server-side routing -- it serves this file for
    // any path with no matching physical file. The routing experiment
    // fakes sub-pages with the History API, so a fresh load or refresh on
    // one of those fake paths lands here. If the attempted path is under
    // the routing experiment, remember it and bounce back to that
    // experiment's index -- its own script recovers the intended path
    // from sessionStorage. Anything else is a genuine dead link.
    var ROUTING_BASE = '/pages-lab/02-routing/';
    var attempted = location.pathname + location.search + location.hash;

    if (attempted.indexOf(ROUTING_BASE) === 0) {
      sessionStorage.setItem('pages-lab-redirect', attempted);
      location.replace(ROUTING_BASE);
    } else {
      document.getElementById('fallback').innerHTML =
        '<p class="title">Page not found</p>' +
        '<p><a href="/pages-lab/">&larr; pages-lab</a></p>';
    }
  </script>
</body>
</html>
